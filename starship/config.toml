# Starship configuration
# See https://starship.rs/config/ for more details

# =============================================================================
# GIT MODULE (Enhanced)
# =============================================================================
[git_status]
style = "bold red"
format = "([\\[$all_status$ahead_behind\\]]($style) )"
conflicted = "⚔"
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
untracked = "?"
stashed = "stash"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[git_commit]
commit_hash_length = 7
style = "bold green"

# =============================================================================
# DIRECTORY MODULE (Enhanced)
# =============================================================================
[directory]
style = "bold blue"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " ro"

# =============================================================================
# MEMORY MODULE (System Info)
# =============================================================================
[memory_usage]
disabled = false
threshold = 70
symbol = "🐏 "
style = "bold dimmed red"

# =============================================================================
# BATTERY MODULE
# =============================================================================
[battery]
disabled = false

[[battery.display]]
threshold = 30
style = "bold red"

# =============================================================================
# TIME MODULE
# =============================================================================
[time]
disabled = false
format = "🕙 [$time]($style) "
style = "bold yellow"

# =============================================================================
# SHELL MODULE (Disabled - not showing properly)
# =============================================================================
[shell]
disabled = true

# =============================================================================
# LANGUAGE MODULES
# =============================================================================
[golang]
symbol = " "
format = "[$symbol($version )]($style)"

[python]
symbol = " "
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"

[rust]
symbol = " "
format = "[$symbol($version )]($style)"

# =============================================================================
# DEVOPS MODULES
# =============================================================================
[docker_context]
symbol = " "
format = "[$symbol$context]($style) "
only_with_files = true

[kubernetes]
disabled = false
symbol = "󱃾 "
format = "[$symbol$context( \\($namespace\\))]($style) "

[aws]
symbol = " "
format = "[$symbol($profile )(\\($region\\) )]($style)"

[terraform]
symbol = "󱁢 "
format = "[$symbol$workspace]($style) "
