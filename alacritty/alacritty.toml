# Alacritty Configuration (macOS)
# See https://alacritty.org/config-alacritty.html for more options

[terminal.shell]
program = "/bin/zsh"
args = ["-l"]

[window]
# Window padding
padding = { x = 10, y = 10 }
# Window opacity
opacity = 0.95

[font]
# Font family - using Nerd Font for proper symbol support
normal = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold = { family = "FiraCode Nerd Font Mono", style = "Bold" }
italic = { family = "FiraCode Nerd Font Mono", style = "Regular" }
bold_italic = { family = "FiraCode Nerd Font Mono", style = "Bold" }
size = 14.0

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.normal]
black   = "#282828"
red     = "#cc241d"
green   = "#98971a"
yellow  = "#d79921"
blue    = "#458588"
magenta = "#b16286"
cyan    = "#689d6a"
white   = "#a89984"

[colors.bright]
black   = "#928374"
red     = "#fb4934"
green   = "#b8bb26"
yellow  = "#fabd2f"
blue    = "#83a598"
magenta = "#d3869b"
cyan    = "#8ec07c"
white   = "#ebdbb2"

[cursor]
# Cursor style
style = { shape = "Block", blinking = "On" }

[scrolling]
# Maximum number of lines in the scrollback buffer
history = 10000
